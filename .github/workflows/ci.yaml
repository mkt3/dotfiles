name: ci

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run make check
        run: make check

      - name: Evaluate NixOS configuration
        if: runner.os == 'Linux'
        env:
          CHECK_DISTRO: NixOS
          NIX_PLATFORM_OVERRIDE: x86_64-linux
        run: bash scripts/check_flake.sh
